[project]
name = "claims-triage"
version = "0.1.0"
description = "Claude-powered claims triage reference agent with human approval and evaluation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "anthropic>=0.40", "mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
